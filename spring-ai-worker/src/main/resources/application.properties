server.address=127.0.0.1
server.port=4192
spring.main.banner-mode=off
spring.application.name=workbench-spring-ai-worker
workbench.bridge-token=${WORKBENCH_BRIDGE_TOKEN:}
workbench.worker-port=${WORKBENCH_WORKER_PORT:4192}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.accesslog.enabled=false
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.max-http-request-header-size=16KB
spring.mvc.log-request-details=false
logging.level.org.springframework.ai=OFF
logging.level.org.springframework.web=OFF
logging.level.org.springframework.retry=OFF
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
